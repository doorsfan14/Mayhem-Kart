name: Build Mayhem Kart

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: Android
      - uses: actions/upload-artifact@v4
        with:
          name: Mayhem-Kart-26.0-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project "iOS/MayhemKart.xcodeproj" \
            -scheme "Mayhem Kart" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/MayhemKart"
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/MayhemKart/Mayhem Kart.app" "$RUNNER_TEMP/Payload/"
          mkdir -p artifacts
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/artifacts/Mayhem-Kart-26.0-Developer-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mayhem-Kart-26.0-iOS-unsigned
          path: artifacts/Mayhem-Kart-26.0-Developer-unsigned.ipa
